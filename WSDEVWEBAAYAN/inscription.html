    <main>
    <h1>Créez un compte</h1>
    <section>
    <h2>Formulaire d'inscription </h2>
    <form action="#" method="POST">
                
                <div>
                    <label for="civilite">Civilité :</label>
                    <select id="civilite" name="civilite" required>
                        <option value="">--Choisissez--</option>
                        <option value="mr">Monsieur</option>
                        <option value="mme">Madame</option>
                    </select>
                </div>
                <br>
                <div>
                    <label for="nom">Nom :</label>
                    <input type="text" id="nom" name="nom" required>
                </div>
                <br>

                <div>
                    <label for="prenom">Prénom :</label>
                    <input type="text" id="prenom" name="prenom" required>
                </div>
                <br>


                <div>
                    <label for="email">Courriel :</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <br>

                <div>
                    <label for="mdp">Mot de passe (8 caractères min.) :</label>
                    <input type="password" id="mdp" name="mdp" minlength="8" required>
                </div>
                <br>

                <div>
                    <label for="mdp_confirm">Confirmation du mot de passe :</label>
                    <input type="password" id="mdp_confirm" name="mdp_confirm" minlength="8" required>
                </div>

                <br>

                <div>
                    <button type="submit">Envoyer</button>
                    <button type="reset">Réinitialiser</button>
                </div>
                </form>
        </section>

            </main>
