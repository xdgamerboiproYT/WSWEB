<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Contact - Lebonplan</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <header>
        <div class="text-center">
        <img src="images/logo.webp" alt="Logo Lebonplan">
        </div>
        <nav class="navbar">
            <ul>
                <li><a href="site.html">Accueil</a></li>
                <li><a href="a-propos.html">À propos</a></li>
                <li><a href="inscription.html">Inscription</a></li>
                <li><a href="connexion.html">Connexion</a></li>
                <li><a href="avis.html">Avis</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>
        <h1>Nous sommes à votre écoute</h1>
        
        <section>
            <h2>Vous avez la parole</h2>
            
            <form action="#" method="POST" >
                
                <div>
                    <label for="nom_contact">Nom complet :</label>
                    <input type="text" id="nom_contact" name="nom_contact" required>
                </div>

                <br>

                <div>
                    <label for="message_contact">Votre message :</label><br>
                    <textarea id="message_contact" name="message_contact" rows="10" cols="50" placeholder="Décrivez votre demande ici..." required></textarea>
                </div>

                <br>

                <div>
                    <button type="submit">Envoyer</button>
                    <button type="reset">Effacer</button>
                </div>

            </form>
        </section>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Lebonplan - Tous droits réservés</p>
    </footer>

</body>
</html>
